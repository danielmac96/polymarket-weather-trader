services:
  postgres:
    image: postgres:16
    container_name: pwa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pwa
      POSTGRES_PASSWORD: pwa
      POSTGRES_DB: pwa
    ports:
      - "5432:5432"
    volumes:
      - pwa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pwa -d pwa"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pwa-postgres-data:
